name: 功能建议
description: 希望增加功能或改善体验？
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么不便
      description: 说说你在什么情况下觉得不方便。
      placeholder: 例如：在手机上打长句时，候选字太小，经常点错。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进
      description: 描述你想要的效果就好，不用考虑怎么实现。
      placeholder: 例如：希望能在设置里调大候选字。
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 其他信息（可选）
      description: 例如其他输入法的类似做法，或相关链接。
