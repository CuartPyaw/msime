# Built-in melody pack. The sample, a kalimba note on C5, is synthesized by scripts/generate_sound_packs.py; the run is the C major pentatonic scale, which belongs to no one.
schema_version = 1
kind = "sound"
id = "msime-pentatonic"
name = "五声音阶"
version = "1.0.0"
license = "CC0-1.0"
author = "水杉输入法"
description = "拇指琴音色，每按一个键沿宫商角徵羽走一个音，两个八度上去再下来，停顿三秒后从头开始。"
permissions = []
mode = "sequence"

[sequence]
sample = "tone.wav"
# C4 D4 E4 G4 A4 C5 D5 E5 G5 A5 C6, then back down A5 G5 E5 D5 C5 A4 G4 E4 D4
semitones = [
  -12, -10, -8, -5, -3, 0, 2, 4, 7, 9, 12,
  9, 7, 4, 2, 0, -3, -5, -8, -10,
]
advance = "key"
