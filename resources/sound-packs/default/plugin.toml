# Built-in sound pack. Every sample is synthesized by scripts/generate_sound_packs.py; regenerate them there rather than editing the files.
schema_version = 1
kind = "sound"
id = "default"
name = "清脆键盘"
version = "1.0.0"
license = "CC0-1.0"
author = "水杉输入法"
description = "合成的机械键盘声：普通键、空格、回车和退格各有一声，另有上屏提示音和里程碑音效。"
permissions = []
mode = "keys"

[sounds]
default = "key.wav"
space = "space.wav"
enter = "enter.wav"
