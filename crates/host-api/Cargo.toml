[package]
name = "msime-host-api"
description = "Versioned C ABI for native input-method hosts: thread-bound session handles and explicit response release."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
msime-client-core = { path = "../client-core" }
msime-engine = { path = "../engine" }
msime-input-runtime = { path = "../input-runtime" }
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
sha2.workspace = true
time.workspace = true

# Microphone capture for `voice_capture_pcm` and `voice_capture_devices`. The iOS keyboard records through AVAudioEngine and HarmonyOS through its own audio kit, so neither links a capture backend (OpenHarmony reports target_os = "linux" and has no ALSA to link).
[target.'cfg(not(any(target_os = "ios", target_env = "ohos")))'.dependencies]
cpal = "0.18"
rubato = "5"

[dev-dependencies]
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_Globalization"] }

# Only linux_catalog uses rustix, and that module excludes OpenHarmony, which reports target_os = "linux" as well.
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
