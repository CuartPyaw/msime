[package]
name = "msime-pack-tool"
description = "msime-pack: checks extension packs (sound, music, command table, effect) by exactly the rules the input method imports them by, for pack authors and the community pack repository's CI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "msime-pack"
path = "src/main.rs"

[dependencies]
# Every rule lives in client-core's plugins module; this tool only reports what `plugins::validate` answers.
msime-client-core = { path = "../client-core" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
